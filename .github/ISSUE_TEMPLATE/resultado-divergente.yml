name: Resultado diferente do esperado
description: A biblioteca deu um resultado diferente da sua conta ou da fonte, ou falta um caso.
title: "Resultado diferente: "
body:
  - type: markdown
    attributes:
      value: |
        Linhas do VRA são dado aberto da ANAC (CC-BY): podem ir como estão, sem alterar nada. Nada de dado pessoal de ninguém.
        O resultado é uma conta sobre o dado da ANAC: não é da ANAC nem da companhia, e não
        prevê o próximo voo.
  - type: input
    id: versao
    attributes:
      label: Versão
      description: "Saída de `python -m vra_anac --version`."
    validations:
      required: true
  - type: textarea
    id: entrada
    attributes:
      label: O que você rodou
      description: A entrada e o comando ou a chamada em Python.
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: O que a biblioteca deu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava, e de onde vem
      description: A conta à mão, a fonte ou a regra.
    validations:
      required: true
