# Testes a cada push e pull request, em todas as versões do Python que o
# pyproject aceita (requires-python), do checkout limpo, sem instalar nada,
# como diz o README. Um job no Windows confere a saída
# da linha de comando fora do UTF-8 (cp1252). O job "pacote" monta o wheel
# e roda o que o pip instala, como o pypi.yml antes de publicar. Toda action fixada pelo commit da
# versão do comentário, lido na API do GitHub em 11/10/2026 (tag se move).
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    # a suíte leva segundos; sem teto, um processo preso segura o job por 6 h
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # "3.x", não um número: o conferir-publico procura o piso e o
          # Python da vitrine no arquivo, e um número aqui esconderia a falta
          # dele na matriz
          python-version: "3.x"
      - run: bash .github/conferir-instalado.sh
      # o PyPI recusa descrição que não renderiza; aqui o aviso vem no push,
      # não na Release (a action confere de novo antes de publicar)
      - run: |
          python -m pip install --quiet "twine==7.0.0"
          python -m twine check --strict dist/*
